# Nginx reverse-proxy config for the Recover Next.js app — the real,
# deployable version of deploy/nginx.conf.example (Phase 0 scaffolding).
#
# Deploy:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/recover
#   sudo ln -s /etc/nginx/sites-available/recover /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # avoid the stock server
#                                                  # block catching :80 first
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain.example.com
#
# Certbot rewrites this file in place to add the 443/SSL server block and
# the 80->443 redirect — the `server { listen 80; ... }` block below is
# what it starts from. Replace every `your-domain.example.com` first.

# ---------------------------------------------------------------------------
# Rate-limit zones — must live outside any `server {}` block (they're
# `http`-context directives; this file is pulled into the `http` block via
# nginx.conf's `include /etc/nginx/sites-enabled/*;`).
#
# Keyed by $binary_remote_addr (compact, IP-based). Razorpay's webhook
# retries and dashboard logins both come from a small, predictable set of
# IPs relative to normal browsing traffic, so a per-IP zone is enough —
# no need for a global limiter.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=webhook_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

# Gzip JSON/HTML API + dashboard responses.
gzip on;
gzip_types application/json text/html text/css application/javascript;
gzip_min_length 256;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;

    # Certbot will insert its HTTP->HTTPS redirect and SSL server block
    # here automatically when run with --nginx. Until then this plain
    # HTTP block proxies straight to the app, headers and all, so the
    # site is fully functional (just not encrypted) before Certbot runs.

    # Security headers — belt-and-suspenders with next.config.mjs's
    # `headers()`, which sets the same three. Nginx's copies apply even
    # to responses next.config.mjs doesn't cover (e.g. a raw error page
    # Nginx itself generates) and survive if the app-level ones are ever
    # accidentally removed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Razorpay webhook receiver — rate-limited to absorb abuse/retries
    # without blocking legitimate delivery. burst=50 covers a legitimate
    # retry storm (Razorpay backs off and retries failed deliveries);
    # nodelay serves bursts immediately instead of queuing them.
    location /api/webhooks/razorpay {
        limit_req zone=webhook_zone burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login — app-level limiter (lib/auth/rateLimit.ts) already caps this
    # at 5 attempts/15min per IP; this is an Nginx-level backstop so a
    # brute-force burst never even reaches the Node process.
    location /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE — the dashboard's live-updates stream (app/api/events/stream).
    # Nginx's default proxy_read_timeout (60s) would silently kill an SSE
    # connection that has no new events for a minute; 300s comfortably
    # covers the 2s poll / ~ping cadence the route already emits to keep
    # it alive, with headroom.
    location /api/events/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        chunked_transfer_encoding off;
    }

    # Everything else — dashboard pages + the rest of the API.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# --- After `certbot --nginx`, expect a block appended/generated like this ---
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     server_name your-domain.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
#     include              /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam           /etc/letsencrypt/ssl-dhparams.pem;
#
#     add_header X-Content-Type-Options "nosniff" always;
#     add_header X-Frame-Options "DENY" always;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     location /api/webhooks/razorpay { ... same as above, with limit_req ... }
#     location /api/auth/login        { ... same as above, with limit_req ... }
#     location /api/events/stream     { ... same as above, with proxy_read_timeout 300s ... }
#     location /                      { ... same as above ... }
# }
#
# server {
#     if ($host = your-domain.example.com) {
#         return 301 https://$host$request_uri;
#     }
#     listen 80;
#     listen [::]:80;
#     server_name your-domain.example.com;
#     return 404;
# }
#
# Certbot only migrates the plain `location / { ... }` block by default —
# after running it, manually copy the three specialized `location` blocks
# (webhook, login, SSE) into the new 443 server block so rate limiting and
# the SSE timeout still apply once traffic moves to HTTPS.
